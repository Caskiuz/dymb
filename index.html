<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para ti 💜</title>

  <!-- ── Preview al enviar el link por WhatsApp/Instagram ──
       [IMPORTANTE] Después de publicar en Vercel, cambia
       og:image y og:url por tu URL real (ver README).      -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gorda… tengo algo que preguntarte 💘">
  <meta property="og:description" content="Del primer mensaje en Facebook a este universo entero. Tócalo hasta el final.">
  <meta property="og:image" content="assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="theme-color" content="#0d0722">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">

  <!-- Tipografías (si no hay internet, cae a serif del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

  <!-- cielo 3D + velo del amanecer -->
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div id="sky-tint" aria-hidden="true"></div>

  <!-- pantalla de carga -->
  <div id="loader">
    <div class="heart-beat">💜</div>
    <div class="bar"><i></i></div>
    <p>preparando el universo…</p>
  </div>

  <!-- música -->
  <button id="mute-btn" aria-label="Silenciar música">🔊</button>

  <!-- ═══ GATE: el sobre sellado ═══ -->
  <div id="gate">
    <div class="hint-top" id="gate-hint">Para ti 💜</div>
    <div id="envelope-wrap">
      <div id="envelope" role="button" aria-label="Abrir el sobre">
        <div class="env-body"></div>
        <div class="env-letter">💜</div>
        <div class="env-flap"></div>
        <div class="env-seal">💗</div>
      </div>
    </div>
    <div class="hint-tap">toca el sobre para abrirlo 💌</div>
  </div>

  <!-- carta ampliada -->
  <div id="letter-card">
    <div id="letter-inner">
      <div id="letter-to"></div>
      <div id="letter-text"></div>
      <button class="btn-primary" id="letter-btn"></button>
    </div>
  </div>

  <!-- ═══ CONTENIDO ═══ -->
  <main id="content">

    <section id="intro">
      <p class="kicker" id="intro-kicker"></p>
      <h1 id="intro-title"></h1>
      <p class="subtitle" id="intro-subtitle"></p>
      <div id="scroll-hint"><span>desliza</span><div class="chev"></div></div>
    </section>

    <section id="timeline" aria-label="Nuestra historia"></section>

    <section id="contador">
      <h2 id="counter-title"></h2>
      <p class="line1" id="counter-line1"></p>
      <div id="counter-grid">
        <div class="count-cell glass"><b id="c-days">0</b><span>días</span></div>
        <div class="count-cell glass"><b id="c-hours">0</b><span>horas</span></div>
        <div class="count-cell glass"><b id="c-mins">0</b><span>min</span></div>
        <div class="count-cell glass"><b id="c-secs">0</b><span>seg</span></div>
      </div>
      <p class="suffix" id="counter-suffix"></p>
    </section>

    <section id="quiz">
      <h2 class="sec-title" id="quiz-title"></h2>
      <p id="quiz-subtitle"></p>
      <div id="quiz-card" class="glass">
        <div id="quiz-hearts"></div>
        <div id="quiz-q"></div>
        <div class="quiz-options" id="quiz-options"></div>
        <div id="quiz-msg"></div>
      </div>
    </section>

    <section id="razones">
      <h2 class="sec-title" id="reasons-title"></h2>
      <p class="hint" id="reasons-hint"></p>
      <div id="reasons-grid"></div>
      <p id="reasons-done">¿Ves por qué? Y podría seguir toda la noche… 💘</p>
    </section>

    <section id="promesas">
      <h2 class="sec-title" id="promises-title"></h2>
      <p class="hint" id="promises-subtitle"></p>
      <div id="promises-grid"></div>
      <div id="promise-msg" class="glass"><span>Toca una promesa y mírala estallar en el universo ✨</span></div>
      <p id="promises-done"></p>
    </section>

    <section id="pregunta">
      <div id="pregunta-sticky">
        <div id="heart-hotspot" aria-hidden="true"></div>
        <p id="q-pre"></p>
        <h2 id="q-big"></h2>
        <div id="q-buttons">
          <div id="btn-no-ghost"><button id="btn-no"></button></div>
          <button id="btn-yes"></button>
        </div>
      </div>
    </section>

    <footer id="footer"></footer>
  </main>

  <!-- mensajes flotantes -->
  <div id="no-msg"></div>
  <div id="egg-toast"></div>

  <!-- ═══ FINAL: ¡dijo que SÍ! ═══ -->
  <div id="finale">
    <div id="finale-card" class="glass">
      <h2 id="finale-title"></h2>
      <p class="f-text" id="finale-text"></p>
      <div id="vows-card">
        <div id="vows-title"></div>
        <ul id="vows-list"></ul>
        <div id="vows-sign"></div>
      </div>
      <div id="cert">
        <div class="c-title" id="cert-title"></div>
        <div class="c-names" id="cert-names"></div>
        <p class="c-text" id="cert-text"></p>
        <div class="c-date" id="cert-stamp"></div>
      </div>
      <div class="row">
        <a id="btn-wa" class="btn-wa" target="_blank" rel="noopener"></a>
        <button id="voice-btn" class="btn-ghost">🎧 Mi mensaje para ti</button>
        <button id="btn-replay" class="btn-ghost"></button>
      </div>
    </div>
  </div>

  <!-- librerías locales (funciona sin depender de CDNs) -->
  <script src="config.js"></script>
  <script src="js/manifest.js"></script>
  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="vendor/confetti/confetti.browser.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
